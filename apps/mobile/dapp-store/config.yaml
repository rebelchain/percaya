# Solana Mobile dApp Store CLI configuration (npx @solana-mobile/dapp-store-cli)
publisher:
  name: percaya
  website: https://percaya.app
  email: team@percaya.app

app:
  name: percaya
  android_package: com.percaya.seeker
  urls:
    license_url: https://percaya.app/docs
    copyright_url: https://percaya.app/docs
    privacy_policy_url: https://percaya.app/docs
    website: https://percaya.app

release:
  address: ''
  media: []
  files:
    - purpose: install
      uri: ../android/app/build/outputs/apk/release/app-release.apk
  catalog:
    en-US:
      name: percaya
      short_description: One buy. One sale. The same price for everyone.
      long_description: >
        Pooled crypto calls on Solana Mobile Seeker. A caller opens a pool on one SPL token,
        fixes every exit rule up front, and locks their own SOL at the same entry and exit price
        as everyone else. Tiers 1-3 bind to a 1-per-device Seeker Genesis Token.
      new_in_version: Initial Dev3pack Solana Mobile Seeker release.
