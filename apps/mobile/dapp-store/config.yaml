# Solana Mobile dApp Store CLI configuration (npx @solana-mobile/dapp-store-cli)
publisher:
  name: percaya
  website: https://percaya.duckdns.org
  email: team@percaya.app

app:
  name: percaya
  android_package: com.percaya.seeker
  urls:
    license_url: https://percaya.duckdns.org/terms
    copyright_url: https://percaya.duckdns.org/terms
    privacy_policy_url: https://percaya.duckdns.org/privacy
    website: https://percaya.duckdns.org

release:
  address: ''
  media: []
  files:
    - purpose: install
      uri: ../android/app/build/outputs/apk/release/app-release.apk
  catalog:
    en-US:
      name: percaya
      short_description: One buy. One sale. The same price for everyone.
      long_description: >
        Skin-in-the-Game Threads for Solana Mobile Seeker. Every post is an immutable on-chain
        pooled call where the caller locks SOL first under fixed TP/SL/max-hold rules. Scan Call QR
        codes with your phone camera, sign via MWA 2.0 / Seed Vault, and get native Android alerts
        when pools buy or settle. Tiers 1-3 bind to a 1-per-device Token-2022 Seeker Genesis Token.
      new_in_version: Dev3pack Global Hackathon release (MWA 2.0, on-device Devnet RPC, Camera QR, Android notifications).
