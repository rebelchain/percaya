# Nginx site config for percaya.duckdns.org (Oracle Cloud Free Tier VPS)
# Install:
#   sudo cp deploy/nginx-percaya.conf /etc/nginx/sites-available/percaya
#   sudo ln -sf /etc/nginx/sites-available/percaya /etc/nginx/sites-enabled/percaya
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d percaya.duckdns.org

server {
    listen 80;
    listen [::]:80;
    server_name percaya.duckdns.org;

    root /opt/percaya/apps/web/dist;
    index index.html;

    # Backend API, Solana Actions (Blinks), and Android App Links
    location ~ ^/(api/|actions\.json|\.well-known/assetlinks\.json) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE (/api/me/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback for /c/:id, /docs, /privacy, /terms
    location / {
        try_files $uri $uri/ /index.html;
    }
}
