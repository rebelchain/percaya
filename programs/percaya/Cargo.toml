[package]
name = "percaya"
version = "0.1.0"
description = "Pooled crypto calls and Seeker hardware-anchored reputation on Solana"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "percaya"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "percaya_amm/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
percaya_amm = { path = "../percaya_amm", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
